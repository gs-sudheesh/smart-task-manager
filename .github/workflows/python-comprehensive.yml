name: Python Comprehensive CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

jobs:
  test-all-projects:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13]
        project: [
          "python_fundamentals",
          "oop", 
          "gui-tkinter",
          "gui-tkinter-grid",
          "gui-tkinter-login"
        ]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install schedule bcrypt flake8 pytest
        if [ -f ${{ matrix.project }}/requirements.txt ]; then pip install -r ${{ matrix.project }}/requirements.txt; fi
    
    - name: Lint ${{ matrix.project }}
      run: |
        cd ${{ matrix.project }}
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --max-line-length=127
    
    - name: Test ${{ matrix.project }} imports
      run: |
        cd ${{ matrix.project }}
        # Test different import patterns based on project type
        if [ "${{ matrix.project }}" = "python_fundamentals" ]; then
          python -c "import task_manager; print('${{ matrix.project }}: Import successful')"
        elif [ "${{ matrix.project }}" = "oop" ]; then
          python -c "import main; print('${{ matrix.project }}: Import successful')"
        else
          # GUI projects - test core modules only
          python -c "
        try:
            import task_manager
            import task
            import storage
            print('${{ matrix.project }}: Core modules OK')
        except Exception as e:
            print(f'${{ matrix.project }}: Import failed - {e}')
            exit(1)
        "
        fi
