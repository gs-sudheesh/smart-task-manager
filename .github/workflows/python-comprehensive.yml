name: Python Comprehensive CI

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main ]

jobs:
  test-all-projects:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9, 3.11]
        project: [
          "python_fundamentals",
          "oop", 
          "gui-tkinter",
          "gui-tkinter-grid",
          "gui-tkinter-login"
        ]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install schedule bcrypt flake8 pytest
        if [ -f ${{ matrix.project }}/requirements.txt ]; then pip install -r ${{ matrix.project }}/requirements.txt; fi
    
    - name: Lint ${{ matrix.project }}
      run: |
        cd ${{ matrix.project }}
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --max-line-length=127
    
    - name: Test ${{ matrix.project }} imports
      run: |
        cd ${{ matrix.project }}
        python -c "import main; print('${{ matrix.project }}: Import successful')"
    
    - name: Test ${{ matrix.project }} basic functionality
      run: |
        cd ${{ matrix.project }}
        # Test that the main modules can be imported without errors
        python -c "
        try:
            import main
            print('Main module: OK')
        except ImportError as e:
            print(f'Import error: {e}')
            exit(1)
        "
