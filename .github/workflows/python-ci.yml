# GitHub Actions CI Workflow for Smart Task Manager
# This workflow runs on every push and pull request to main/develop branches
name: Python CI

# Trigger conditions: runs on push/PR to main or develop branches
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    # Use Ubuntu latest for consistent CI environment
    runs-on: ubuntu-latest
    
    # Matrix strategy allows testing multiple Python versions
    # Currently set to Python 3.13 (user's local version)
    strategy:
      matrix:
        python-version: [3.13]

    steps:
    # Checkout the repository code
    - uses: actions/checkout@v4
    
    # Set up Python environment with specified version
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    # Install system dependencies required for tkinter GUI applications
    # This is crucial for GUI projects to work in headless CI environment
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk
    
    # Install Python dependencies from requirements-ci.txt
    # This includes all necessary packages for testing
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
    
    # Code quality checks using flake8 linter
    # First run: Check for critical errors (E9,F63,F7,F82)
    # Second run: Check complexity and line length with warnings only
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    # Test procedural programming project (CLI)
    # Simple import test to verify module structure
    - name: Test python_fundamentals
      run: |
        cd python_fundamentals
        python -c "import task_manager; print('python_fundamentals: OK')"
    
    # Test object-oriented programming project (CLI)
    # Import main module to verify OOP structure
    - name: Test oop
      run: |
        cd oop
        python -c "import main; print('oop: OK')"
    
    - name: Test GUI applications (imports only)
      run: |
        # Test that GUI modules can be imported without creating windows
        # This avoids TclError in headless CI environment
        for project in gui-tkinter gui-tkinter-grid gui-tkinter-login; do
          echo "Testing $project imports..."
          cd $project
          python -c "
        try:
            # Test individual module imports without executing main
            import task_manager
            import task
            import storage
            # Only import constants if it exists
            try:
                import constants
                print('$project: All modules OK (including constants)')
            except ImportError:
                print('$project: Core modules OK (constants not found)')
        except Exception as e:
            print(f'$project: Import failed - {e}')
            exit(1)
        "
          cd ..
        done
    
    - name: Test web-interface (Flask app)
      run: |
        cd web-interface
        echo "Testing web-interface imports..."
        # Test Flask app imports without starting the server
        python -c "
        try:
            # Import Flask app components
            import app
            import task
            print('web-interface: Flask app imports OK')
            
            # Test that we can create the app instance
            from app import app as flask_app
            print('web-interface: Flask app instance created successfully')
            
        except Exception as e:
            print(f'web-interface: Import failed - {e}')
            exit(1)
        "

    - name: Run rest-api unit tests
      run: |
        cd rest-api
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pytest -q
