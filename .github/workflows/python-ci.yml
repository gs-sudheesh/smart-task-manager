name: Python CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-ci.txt
    
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Test python_fundamentals
      run: |
        cd python_fundamentals
        python -c "import task_manager; print('python_fundamentals: OK')"
    
    - name: Test oop
      run: |
        cd oop
        python -c "import main; print('oop: OK')"
    
    - name: Test gui-tkinter
      run: |
        cd gui-tkinter
        python -c "import main; print('gui-tkinter: OK')"
    
    - name: Test gui-tkinter-grid
      run: |
        cd gui-tkinter-grid
        python -c "import main; print('gui-tkinter-grid: OK')"
    
    - name: Test gui-tkinter-login
      run: |
        cd gui-tkinter-login
        python -c "import main; print('gui-tkinter-login: OK')"
